[package]
name = "desktop-editor"
version = "0.1.0"
description = "MIDI Controller Desktop Editor"
authors = []
edition = "2021"

[lib]
name = "desktop_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
midir = "0.10"
tokio = { version = "1", features = ["sync", "time"] }
thiserror = "1"
